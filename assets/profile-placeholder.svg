<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Profile photo placeholder</title>
  <desc id="desc">A calm abstract glassmorphism illustration. Replace this file with your own portrait.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18243d"/>
      <stop offset=".52" stop-color="#202d4b"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bf2d2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b5a1ff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8ec7ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8ec7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#background)"/>
  <circle cx="650" cy="190" r="240" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="120" cy="780" r="270" fill="#6e68d9" opacity=".24" filter="url(#blur)"/>
  <circle cx="400" cy="435" r="235" fill="none" stroke="#d9e7ff" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="400" cy="435" r="185" fill="none" stroke="#d9e7ff" stroke-opacity=".11" stroke-width="2" stroke-dasharray="4 12"/>
  <circle cx="400" cy="365" r="95" fill="url(#orb)" opacity=".72"/>
  <path d="M210 720c18-135 93-210 190-210s172 75 190 210" fill="url(#orb)" opacity=".58"/>
  <rect x="84" y="80" width="632" height="840" rx="36" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <rect x="122" y="812" width="556" height="64" rx="18" fill="#10192b" fill-opacity=".58" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="400" y="850" fill="#f4f6ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" text-anchor="middle">YOUR PHOTO HERE</text>
  <text x="400" y="890" fill="#b8c6df" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">REPLACE assets/profile-placeholder.svg</text>
</svg>
